<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">EDITH private golden 3D HUD</title>
  <desc id="desc">A recruiter-facing teaser indicating that EDITH's current native interface is intentionally not shown publicly.</desc>
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#e8c46a" stop-opacity=".32"/>
      <stop offset=".52" stop-color="#d8a84e" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop stop-color="#87651f"/>
      <stop offset=".5" stop-color="#f4da8c"/>
      <stop offset="1" stop-color="#a97e2d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="520" rx="28" fill="#050911"/>
  <path d="M24 92V44q0-20 20-20h140M1216 24h140q20 0 20 20v48M24 428v48q0 20 20 20h140M1216 496h140q20 0 20-20v-48" fill="none" stroke="#d8a84e" stroke-width="2" opacity=".55"/>
  <circle cx="340" cy="260" r="228" fill="url(#halo)"/>
  <g transform="translate(340 260)" fill="none" stroke="url(#gold)" filter="url(#glow)">
    <circle r="126" stroke-width="3" stroke-dasharray="118 20 26 16"/>
    <circle r="94" stroke-width="2" stroke-dasharray="42 14" opacity=".8"/>
    <circle r="61" stroke-width="5" stroke-dasharray="12 9"/>
    <path d="M-153 0h-38M153 0h38M0-153v-38M0 153v38" stroke-width="2"/>
    <circle r="20" fill="#d8a84e" fill-opacity=".14" stroke-width="2"/>
  </g>
  <text x="650" y="170" fill="#f4da8c" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="9">E D I T H</text>
  <text x="650" y="228" fill="#f6f2e8" font-family="Georgia, serif" font-size="42">Native golden 3D HUD</text>
  <text x="650" y="278" fill="#aab3c2" font-family="Segoe UI, Arial, sans-serif" font-size="20">The current production interface is intentionally not revealed publicly.</text>
  <text x="650" y="318" fill="#aab3c2" font-family="Segoe UI, Arial, sans-serif" font-size="20">Public screenshots below demonstrate workflows and grounded results only.</text>
  <rect x="650" y="370" width="438" height="48" rx="24" fill="#d8a84e" fill-opacity=".1" stroke="#d8a84e" stroke-opacity=".65"/>
  <text x="869" y="401" text-anchor="middle" fill="#f4da8c" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="2">PRIVATE IMPLEMENTATION · ACCESS BY REQUEST</text>
</svg>
